name: thrive-test-${THRIVE_TEST_INSTANCE:?Run scripts/initialize-local.ps1 first}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: thrive_test
      POSTGRES_USER: thrive_test_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/initialize-local.ps1 first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - thrive_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  thrive_test_postgres:
